[package]
name = "tauri-plugin-native-player"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-native-player"
description = "RainFlix in-app Android Media3 player"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false }
url = "2"
