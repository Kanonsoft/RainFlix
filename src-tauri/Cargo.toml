[package]
name = "rainflix"
version = "2.0.0"
description = "RainFlix desktop application"
authors = ["Kanonsoft"]
edition = "2021"

[lib]
name = "rainflix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
native-player-smoke = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["io-util", "net", "process", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-single-instance = "2"
librqbit = "9.0.1"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-native-player = { path = "plugins/native-player" }
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
